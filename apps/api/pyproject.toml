[project]
name = "fitness-router-api"
version = "0.1.0"
description = "LangGraph fitness coaching multi-agent router with DSPy intent optimization."
requires-python = ">=3.11,<3.14"
dependencies = [
  "dspy>=2.6.0",
  "fastapi>=0.115.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.60",
  "optuna>=4.0.0",
  "orjson>=3.10.12",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "rapidfuzz>=3.11.0",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.4"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitness_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["fitness_router"]
omit = [
  "src/fitness_router/__main__.py",
  "src/fitness_router/router_program.py"
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
